name: merge-ready

# Decision 0040: shows on each PR whether it is ready to merge (format, ticked boxes, task done with the PR number,
# a reviewer's pass for the head commit, decision 0063) as the commit status `merge-ready`. A ruleset on `main` requires
# that status (decision 0073). The job has its own name, so its check run, green whenever it posted a status, is never
# taken for the status.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited]

concurrency:
  group: merge-ready-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  merge-ready:
    name: compute merge-ready
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/merge-ready.mjs "${{ github.event.pull_request.number || github.event.issue.number }}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
